name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/validate.py
      - name: Build skill zip for Claude apps
        run: |
          mkdir -p dist
          cd skills && zip -r ../dist/more-ambitious.zip more-ambitious
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/more-ambitious.zip
          generate_release_notes: true
